name: Build
on:
  pull_request:
  push:
    branches:
      - master
      - 'release-**'
      - 'check-**'
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    # Use the stricter GCC image for C even while ubuntu-latest rolls out gradually.
    runs-on: ${{ matrix.platform == 'c' && 'ubuntu-26.04' || 'ubuntu-latest' }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
        - platform: c
          shard: 0
          shards: 3
        - platform: c
          shard: 1
          shards: 3
        - platform: c
          shard: 2
          shards: 3
        - platform: js
          shard: 0
          shards: 1
        - platform: wasm-gc
          shard: 0
          shards: 1
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-java@v6
      with:
        java-version: 25
        distribution: temurin
    - uses: actions/setup-node@v7
      with:
        node-version: 26
    - uses: gradle/actions/setup-gradle@v5
    - name: Show C compiler version
      if: matrix.platform == 'c'
      run: gcc --version
    - run: |
        platforms=("c" "js" "wasm-gc")
        args=()
        for v in "${platforms[@]}"
        do
          if [[ "${{ matrix.platform }}" == "$v" ]]; then
            args+=("-Pteavm.tests.${v}=true")
          else
            args+=("-Pteavm.tests.${v}=false")
          fi
        done
        args+=("-Pteavm.tests.optimized=true")
        args+=("-Pteavm.tests.shardCount=${{ matrix.shards }}")
        args+=("-Pteavm.tests.shardIndex=${{ matrix.shard }}")
        args+=("-Pteavm.localNodeJS=true")
        args+=("-Pteavm.tests.c.runWrapper=")
        args+=("-Dorg.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m")
        echo "${args[@]}"
        export TEAVM_TEST_BROWSER_LOG=1
        ./gradlew "${args[@]}" --max-workers=2 --profile --stacktrace test
    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: "test-reports-${{ matrix.platform }}-${{ matrix.shard }}"
        path: |
          build/reports/profile
          tests/build/test-results/test/TEST-*.xml
          tests/build/reports/tests/test
          tests/build/teavm-tests/browser-stderr-*.txt
          tests/build/teavm-tests/browser-stdout-*.txt
  checkstyle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: 25
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v5
      - run: |
          args=()
          args+=("-Dorg.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m")
          ./gradlew "${args[@]}" --max-workers=2 -Pteavm.tests.js=false -Pteavm.tests.wasm-gc=false -Pteavm.tests.c=false -Pteavm.tests.optimized=false check -x test
      - run: ./gradlew -p build-logic --max-workers=2 -Pteavm.tests.js=false -Pteavm.tests.wasm-gc=false -Pteavm.tests.c=false -Pteavm.tests.optimized=false test checkstyleTest
